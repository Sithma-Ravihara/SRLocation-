<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SRLocation Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg:#050a12; --bg2:#080f1c; --bg3:#0c1626;
      --card:rgba(12,22,38,0.95); --card2:rgba(16,28,48,0.88);
      --border:rgba(255,255,255,0.07); --border2:rgba(0,212,255,0.18);
      --text:#e8f4ff; --text2:#a0b8d0; --muted:#5a7a9a;
      --accent:#00d4ff; --accent2:#00ff88; --accent3:#ff6b35;
      --danger:#ff3366; --warning:#ffb020;
      --glow:rgba(0,212,255,0.18); --shadow:0 20px 60px rgba(0,0,0,0.6);
      --shadow2:0 4px 20px rgba(0,0,0,0.4); --blur:20px; --r:18px; --r2:12px;
    }
    .light-theme {
      --bg:#f0f4ff; --bg2:#e8eef8; --bg3:#dde5f5;
      --card:rgba(255,255,255,0.95); --card2:rgba(240,244,255,0.9);
      --border:rgba(0,0,0,0.08); --border2:rgba(0,120,200,0.2);
      --text:#0a1628; --text2:#2a4a6a; --muted:#6080a0;
      --accent:#0088cc; --accent2:#00aa55; --accent3:#ee5500;
      --danger:#cc1133; --warning:#cc8800;
      --glow:rgba(0,136,204,0.1); --shadow:0 20px 60px rgba(0,0,0,0.12);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;}

    /* HEADER */
    header{margin:10px 10px 0;padding:10px 14px;background:var(--card);border:1px solid var(--border2);backdrop-filter:blur(var(--blur));border-radius:var(--r);box-shadow:var(--shadow2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;position:relative;overflow:hidden;}
    header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));}
    .brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
    .brand h1{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-0.5px;line-height:1;white-space:nowrap;}
    .brand h1 .pro{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .brand small{font-size:0.68rem;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;display:block;}
    .hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:0.68rem;font-weight:700;border:1px solid var(--border);background:var(--card2);color:var(--text2);white-space:nowrap;}
    .badge.live{color:var(--accent2);border-color:rgba(0,255,136,0.3);}
    .badge.warn{color:var(--warning);border-color:rgba(255,176,32,0.3);}
    .badge.bad{color:var(--danger);border-color:rgba(255,51,102,0.3);}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
    .icon-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:var(--r2);cursor:pointer;display:grid;place-items:center;font-size:1rem;transition:all 0.15s;}
    .icon-btn:active{transform:scale(0.92);}

    /* STAGE */
    .stage{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0;overflow:hidden;}

    /* MAP */
    .map-wrap{position:relative;flex:1;min-height:200px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border2);box-shadow:var(--shadow),0 0 40px var(--glow);}
    .map-wrap.fullscreen{position:fixed;inset:0;z-index:9999;border-radius:0;}
    #map{position:absolute;inset:0;z-index:1;}
    .map-overlay{position:absolute;inset:0;pointer-events:none;z-index:10;}

    /* Search */
    .search-row{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:auto;}
    .search-wrap{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--border2);backdrop-filter:blur(var(--blur));border-radius:var(--r2);padding:0 8px 0 12px;box-shadow:var(--shadow2);}
    .search-wrap input{border:none;outline:none;background:transparent;color:var(--text);flex:1;font:inherit;font-size:0.85rem;padding:10px 0;min-width:0;}
    .search-wrap input::placeholder{color:var(--muted);}
    .search-go{border:none;cursor:pointer;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0099bb);color:#000;font-weight:800;padding:8px 14px;font-size:0.8rem;}

    /* Speed HUD */
    .speed-hud{position:absolute;bottom:12px;left:12px;pointer-events:none;background:var(--card);border:1px solid var(--border2);backdrop-filter:blur(var(--blur));border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow2),0 0 20px var(--glow);min-width:100px;}
    .hud-spd{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;line-height:1;color:var(--accent);}
    .hud-unit{font-size:0.68rem;color:var(--muted);font-weight:600;}
    .hud-mode{font-size:0.72rem;color:var(--accent2);font-weight:700;margin-top:3px;}

    /* Compass */
    .compass{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);pointer-events:none;background:var(--card);border:1px solid var(--border2);backdrop-filter:blur(var(--blur));border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow2);}
    .c-ring{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);display:grid;place-items:center;background:rgba(0,212,255,0.05);position:relative;}
    .c-ring::before{content:'N';position:absolute;top:2px;font-size:0.5rem;font-weight:800;color:var(--danger);}
    .needle{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:14px solid var(--danger);transform-origin:center 14px;transition:transform 0.15s linear;}
    .c-info{display:flex;flex-direction:column;gap:1px;}
    .c-deg{font-size:0.85rem;font-weight:800;font-family:'Syne',sans-serif;}
    .c-limit{font-size:0.68rem;color:var(--muted);font-weight:600;}

    /* FABs */
    .fabs{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
    .fab{width:40px;height:40px;border:1px solid var(--border2);background:var(--card);color:var(--text);border-radius:var(--r2);cursor:pointer;font-size:1rem;backdrop-filter:blur(var(--blur));box-shadow:var(--shadow2);display:grid;place-items:center;transition:all 0.15s;}
    .fab:active{transform:scale(0.9);}
    .fab.on{border-color:var(--accent);background:rgba(0,212,255,0.12);}

    /* Speed alert */
    .spd-alert{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,var(--danger),#cc1144);color:white;font-weight:800;font-size:0.8rem;box-shadow:0 8px 30px rgba(255,51,102,0.5);white-space:nowrap;pointer-events:none;}
    .spd-alert.show{display:flex;animation:shake 0.4s ease;}
    @keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 6px))}60%{transform:translateX(calc(-50% + 6px))}}

    /* GPS debug banner */
    .gps-debug{position:absolute;top:62px;left:12px;right:12px;z-index:20;background:rgba(255,176,32,0.95);color:#000;font-size:0.75rem;font-weight:700;padding:8px 12px;border-radius:10px;display:none;line-height:1.5;}
    .gps-debug.show{display:block;}

    /* BOTTOM UI */
    .ui-panel{flex-shrink:0;display:flex;flex-direction:column;gap:10px;max-height:44vh;min-height:0;}
    .tab-bar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:5px;gap:4px;flex-shrink:0;}
    .tab-btn{border:none;cursor:pointer;border-radius:14px;padding:9px 6px;background:transparent;color:var(--muted);font:inherit;font-size:0.8rem;font-weight:700;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
    .tab-btn.active{background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(0,212,255,0.05));color:var(--text);border:1px solid rgba(0,212,255,0.2);}
    .panels-wrap{flex:1;overflow-y:auto;overflow-x:hidden;}
    .panels-wrap::-webkit-scrollbar{width:3px;}
    .panels-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
    .panel{display:none;}
    .panel.active{display:block;}

    /* DRIVE TAB */
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
    .goal-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:8px;}
    .goal-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.72rem;font-weight:700;}
    .goal-head span:last-child{color:var(--accent2);}
    .bar{height:6px;border-radius:999px;background:rgba(255,255,255,0.07);overflow:hidden;}
    .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s ease;width:0%;}
    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;}
    .sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;position:relative;overflow:hidden;}
    .sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0.35;}
    .sc-lbl{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:700;}
    .sc-val{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--text);line-height:1.2;margin-top:3px;}
    .sc-sub{font-size:0.62rem;color:var(--muted);margin-top:2px;}

    /* BUTTONS */
    .btn{border:none;border-radius:var(--r2);padding:13px;font:inherit;font-size:0.88rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;}
    .btn:active{transform:scale(0.95);}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#0099bb);color:#000;}
    .btn.stop{background:linear-gradient(135deg,var(--danger),#cc1144);color:#fff;}
    .btn.sos{background:linear-gradient(135deg,#ff6b35,#e84000);color:#fff;}
    .btn.soft{background:var(--card2);color:var(--text);border:1px solid var(--border);}
    .btn.ghost{background:transparent;color:var(--danger);border:1px solid rgba(255,51,102,0.3);}

    /* SETTINGS */
    .scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
    .scard h3{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
    .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
    .field:last-child{margin-bottom:0;}
    .field label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);font-weight:700;}
    .field input,.field select{width:100%;border-radius:var(--r2);border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);padding:10px 12px;font:inherit;font-size:0.85rem;outline:none;transition:border-color 0.15s;}
    .field input:focus,.field select:focus{border-color:var(--accent);}
    .togs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
    .tog{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted);font:inherit;font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.15s;flex:1;min-width:80px;text-align:center;}
    .tog.on{background:rgba(0,212,255,0.1);color:var(--accent);border-color:rgba(0,212,255,0.35);}
    .chart-wrap{position:relative;height:130px;}
    .map-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .upload-row{display:flex;gap:8px;}
    .upload-row input{flex:1;}
    .file-lbl{display:inline-flex;align-items:center;padding:10px 12px;border:1px solid var(--border);background:rgba(255,255,255,0.04);border-radius:var(--r2);cursor:pointer;font-size:0.8rem;color:var(--text2);white-space:nowrap;}

    /* HISTORY */
    .save-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
    .save-sec h3{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:800;margin-bottom:10px;}
    .trip-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:border-color 0.2s;}
    .trip-card:hover{border-color:var(--border2);}
    .trip-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
    .trip-name{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:800;}
    .trip-date{font-size:0.68rem;color:var(--muted);margin-top:2px;}
    .trip-dist{font-size:0.75rem;font-weight:800;color:var(--accent2);}
    .trip-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:0.75rem;color:var(--text2);margin-bottom:8px;}
    .trip-stats strong{color:var(--text);font-weight:700;}
    .trip-acts{display:flex;gap:6px;}

    /* OVERLAY + DRAWER */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:80;display:none;}
    .overlay.show{display:block;}
    .drawer{position:fixed;top:0;right:-100%;width:min(88vw,360px);height:100%;background:var(--bg2);border-left:1px solid var(--border2);box-shadow:-20px 0 60px rgba(0,0,0,0.6);z-index:90;transition:right 0.3s cubic-bezier(0.25,0.46,0.45,0.94);overflow-y:auto;padding:20px;}
    .drawer.open{right:0;}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .drawer-head h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;}

    /* TOAST */
    #toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px) scale(0.95);background:var(--card);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow2);z-index:200;opacity:0;transition:all 0.25s cubic-bezier(0.25,0.46,0.45,0.94);font-size:0.85rem;font-weight:600;pointer-events:none;max-width:min(90vw,340px);text-align:center;backdrop-filter:blur(var(--blur));}
    #toast.show{opacity:1;transform:translate(-50%,0) scale(1);}

    /* CUSTOM MARKER */
    .my-pin{width:48px;height:48px;position:relative;}
    .pin-bg{position:absolute;inset:0;border-radius:50% 50% 50% 4px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent),#0099bb);border:2px solid rgba(255,255,255,0.9);box-shadow:0 0 0 4px rgba(0,212,255,0.25),0 8px 20px rgba(0,0,0,0.4);}
    .pin-in{position:absolute;inset:5px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--bg3);font-size:1.3rem;line-height:1;border:1.5px solid rgba(255,255,255,0.5);}
    .pin-in img{width:100%;height:100%;object-fit:cover;}
    .leaflet-control-attribution{font-size:9px!important;}
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>SR<span class="pro">Location Pro</span></h1>
    <small id="statusText">GPS initializing…</small>
  </div>
  <div class="hdr-right">
    <div id="gpsBadge" class="badge warn"><div class="dot"></div>Waiting</div>
    <div id="battBadge" class="badge">🔋--</div>
    <button class="icon-btn" id="themeBtn">🌓</button>
    <button class="icon-btn" id="drawerBtn">⚙️</button>
  </div>
</header>

<div class="stage">
  <div class="map-wrap" id="mapWrap">
    <div id="map"></div>
    <div class="map-overlay">
      <div class="search-row">
        <div class="search-wrap">
          <input id="searchIn" type="text" placeholder="ස්ථානයක් සොයන්න…" autocomplete="off"/>
          <button class="search-go" id="searchBtn">🔍</button>
        </div>
      </div>
      <div class="speed-hud">
        <div id="hudSpd" class="hud-spd">0.0</div>
        <div class="hud-unit">km/h</div>
        <div id="hudMode" class="hud-mode">⚫ Idle</div>
      </div>
      <div class="compass">
        <div class="c-ring"><div id="needle" class="needle"></div></div>
        <div class="c-info">
          <div id="cDeg" class="c-deg">0°</div>
          <div id="cLimit" class="c-limit">Limit --</div>
        </div>
      </div>
      <div id="spdAlert" class="spd-alert">⚠️ Over Speed!</div>
      <div id="gpsDebug" class="gps-debug"></div>
      <div class="fabs">
        <button class="fab" id="fullBtn">⛶</button>
        <button class="fab" id="recentBtn">🎯</button>
        <button class="fab" id="headBtn">🧭</button>
      </div>
    </div>
  </div>

  <div class="ui-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="driveTab">🚗 Drive</button>
      <button class="tab-btn" data-tab="cfgTab">⚙️ Config</button>
      <button class="tab-btn" data-tab="histTab">📁 History</button>
    </div>
    <div class="panels-wrap">

      <!-- DRIVE -->
      <div id="driveTab" class="panel active">
        <div class="action-row">
          <button id="trackBtn" class="btn primary">▶ Start</button>
          <button id="sosBtn" class="btn sos">🚨 SOS</button>
        </div>
        <div class="goal-bar">
          <div class="goal-head"><span>Daily Goal</span><span id="goalPct">0%</span></div>
          <div class="bar"><div id="barFill" class="bar-fill"></div></div>
        </div>
        <div class="stats-grid">
          <div class="sc"><div class="sc-lbl">Distance</div><div id="distVal" class="sc-val">0.00</div><div class="sc-sub">km</div></div>
          <div class="sc"><div class="sc-lbl">Avg Speed</div><div id="avgVal" class="sc-val">0.0</div><div class="sc-sub">km/h</div></div>
          <div class="sc"><div class="sc-lbl">Duration</div><div id="durVal" class="sc-val">00:00</div><div class="sc-sub">active</div></div>
          <div class="sc"><div class="sc-lbl">Calories</div><div id="calVal" class="sc-val">0</div><div class="sc-sub">kcal</div></div>
          <div class="sc"><div class="sc-lbl">Steps</div><div id="stepsVal" class="sc-val">0</div><div class="sc-sub">est.</div></div>
          <div class="sc"><div class="sc-lbl">Altitude</div><div id="altVal" class="sc-val">--</div><div class="sc-sub">meters</div></div>
        </div>
      </div>

      <!-- CONFIG -->
      <div id="cfgTab" class="panel">
        <div class="scard">
          <h3>📊 Preferences</h3>
          <div class="f2">
            <div class="field"><label>Weight (kg)</label><input id="wIn" type="number" min="20" max="250" step="0.5" value="65"></div>
            <div class="field"><label>Speed Limit</label><input id="limIn" type="number" min="0" step="1" value="50"></div>
            <div class="field"><label>Daily Goal (km)</label><input id="goalIn" type="number" min="0.1" step="0.1" value="5"></div>
            <div class="field"><label>Avatar Style</label>
              <select id="avStyle"><option value="car">🚗 Car</option><option value="person">👤 Person</option><option value="pin">📍 Pin</option></select>
            </div>
          </div>
          <div class="field">
            <label>Avatar Image</label>
            <div class="upload-row">
              <input id="avUrl" type="text" placeholder="https://… ">
              <label class="file-lbl">📁<input type="file" id="avFile" accept="image/*" style="display:none"></label>
            </div>
          </div>
          <div class="togs">
            <button class="tog" id="togVoice">Voice ON</button>
            <button class="tog" id="togVib">Vibrate ON</button>
            <button class="tog" id="togBat">BatSave ON</button>
          </div>
        </div>
        <div class="scard">
          <h3>📈 Speed Graph</h3>
          <div class="chart-wrap"><canvas id="speedChart"></canvas></div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn soft" id="exportBtn" style="flex:1;padding:9px;font-size:0.8rem;">📤 GPX</button>
            <button class="btn soft" id="saveTripBtn" style="flex:1;padding:9px;font-size:0.8rem;">💾 Save</button>
          </div>
        </div>
        <div class="scard">
          <h3>🗺️ Map Layer</h3>
          <div class="map-btns">
            <button class="btn soft" id="vecBtn">🗺 Vector</button>
            <button class="btn soft" id="satBtn">🛰 Satellite</button>
          </div>
        </div>
        <div class="scard">
          <button class="btn ghost" id="clearBtn" style="width:100%;padding:11px;">🗑️ Clear All Data</button>
        </div>
      </div>

      <!-- HISTORY -->
      <div id="histTab" class="panel">
        <div class="save-sec">
          <h3>💾 Save Journey</h3>
          <div class="field" style="margin-bottom:10px;"><input id="tripNameIn" type="text" placeholder="ගමනට නමක් දෙන්න…"></div>
          <div style="display:flex;gap:8px;">
            <button class="btn primary" id="saveNowBtn" style="flex:1;">Save Now</button>
            <button class="btn soft" id="refreshBtn" style="flex:1;">🔄 Refresh</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:8px;"><input id="filterIn" type="text" placeholder="Filter trips…"></div>
        <div id="histList"></div>
      </div>

    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawerEl">
  <div class="drawer-head">
    <h2>⚡ Settings</h2>
    <button class="icon-btn" id="closeDrawer">✕</button>
  </div>
  <div class="scard">
    <h3>🆘 SOS Contact</h3>
    <div class="field"><label>Phone / Email</label><input id="sosIn" type="text" placeholder="07XXXXXXXX"></div>
    <button class="btn soft" id="testGpsBtn" style="width:100%;margin-top:8px;padding:10px;">🧪 Test GPS</button>
  </div>
</aside>

<div id="toast"></div>

<script>
/* ── HELPERS ── */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

function toast(msg, ms=2800) {
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'), ms);
}

function fmtDur(ms) {
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return `${h}:${pad(m)}:${pad(sec)}`;
  return `${pad(m)}:${pad(sec)}`;
}
const pad = n => String(n).padStart(2,'0');

function fmtDT(ts) {
  return new Date(ts).toLocaleString([],{dateStyle:'short',timeStyle:'short'});
}

function haversine(a,b) {
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function speak(t) {
  if(!S.voiceOn||!window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; window.speechSynthesis.speak(u); }catch(e){}
}
function vib(p){ if(S.vibOn&&navigator.vibrate) navigator.vibrate(p); }
function sanUrl(u){ if(!u) return ''; const v=String(u).trim(); if(v.startsWith('data:image/')) return v; try{ const x=new URL(v); if(x.protocol==='http:'||x.protocol==='https:') return v; }catch(e){} return ''; }

/* ── LS ── */
const LS=k=>localStorage.getItem('sr_'+k);
const LSS=(k,v)=>localStorage.setItem('sr_'+k,String(v));

/* ── STATE ── */
const S={
  map:null, vecL:null, satL:null, marker:null, accCircle:null, pathLine:null, chart:null,
  loc:null, heading:0, headingUp:false,
  tracking:false, watchId:null,
  battLevel:1, startTime:null, lastAt:0, lastPos:null,
  dist:0, cals:0, steps:0, maxSpd:0, tripPts:[], speedD:[], speedLbl:[],
  trips:[],
  theme: LS('theme')||'dark',
  mapStyle: LS('mstyle')||'vector',
  voiceOn: LS('voice')!=='false',
  vibOn: LS('vib')!=='false',
  batSave: LS('bat')!=='false',
  avStyle: LS('avs')||'car',
  avUrl: LS('avu')||'',
  sos: LS('sos')||'',
  goalKm: parseFloat(LS('goal')||'5'),
  weightKg: parseFloat(LS('weight')||'65'),
  speedLimit: parseFloat(LS('limit')||'50'),
  overFired:false, firstFix:false
};

function saveCfg(){
  LSS('theme',S.theme); LSS('mstyle',S.mapStyle);
  LSS('voice',S.voiceOn); LSS('vib',S.vibOn); LSS('bat',S.batSave);
  LSS('avs',S.avStyle); LSS('avu',S.avUrl||''); LSS('sos',S.sos||'');
  LSS('goal',S.goalKm); LSS('weight',S.weightKg); LSS('limit',S.speedLimit);
}

/* ── TRIPS ── */
function loadTrips(){ try{ S.trips=JSON.parse(localStorage.getItem('sr_trips_v5')||'[]')||[]; }catch(e){ S.trips=[]; } }
function saveTrips(){ localStorage.setItem('sr_trips_v5',JSON.stringify(S.trips)); }

function finalizeTrip(explicit){
  if(!S.tripPts.length){ if(explicit) toast('No data to save'); return; }
  const elapsed=S.startTime?Date.now()-S.startTime:0;
  const avg=elapsed>0?S.dist/(elapsed/3600000):0;
  const name=($('tripNameIn').value.trim())||`Trip ${new Date().toLocaleDateString()}`;
  S.trips.unshift({id:Date.now(),name,startTime:S.startTime||Date.now(),durationMs:elapsed,distanceKm:S.dist,avgSpeed:avg,maxSpeed:S.maxSpd,calories:Math.round(S.cals),points:[...S.tripPts]});
  if(S.trips.length>30) S.trips=S.trips.slice(0,30);
  saveTrips(); renderHist();
  toast(`Saved: ${name}`); speak('Trip saved');
  confetti({particleCount:60,origin:{y:0.5}});
}

/* ── MAP ── */
function mkHtml(){
  const av=sanUrl(S.avUrl);
  const inner=av?`<img src="${av}" alt="">`:(S.avStyle==='pin'?'📍':S.avStyle==='person'?'👤':'🚗');
  return `<div class="my-pin"><div class="pin-bg"></div><div class="pin-in">${inner}</div></div>`;
}
function mkIcon(){ return L.divIcon({className:'',html:mkHtml(),iconSize:[48,48],iconAnchor:[24,44]}); }

function initMap(){
  S.map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([7.8731,80.7718],8);
  S.vecL=L.tileLayer(
    S.theme==='light'
      ?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:20}
  ).addTo(S.map);

  // ── SATELLITE: OpenTopoMap as fallback (free, no key needed) ──
  // Primary: ESRI | Fallback: Google Satellite (via CARTO proxy workaround)
  S.satL=L.tileLayer(
    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {attribution:'© Google',maxZoom:20,crossOrigin:true}
  );

  S.marker=L.marker([7.8731,80.7718],{icon:mkIcon(),zIndexOffset:1000}).addTo(S.map);
  S.pathLine=L.polyline([],{color:'#00d4ff',weight:4,lineCap:'round',lineJoin:'round',opacity:0.85}).addTo(S.map);
  initChart();
}

function applyStyle(){
  if(!S.map) return;
  if(S.mapStyle==='satellite'){
    if(S.map.hasLayer(S.vecL)) S.map.removeLayer(S.vecL);
    if(!S.map.hasLayer(S.satL)) S.satL.addTo(S.map);
    S.pathLine.setStyle({color:'#00ff88'});
  } else {
    if(S.map.hasLayer(S.satL)) S.map.removeLayer(S.satL);
    if(!S.map.hasLayer(S.vecL)) S.vecL.addTo(S.map);
    S.pathLine.setStyle({color:'#00d4ff'});
  }
}

function applyTheme(){
  document.body.classList.toggle('light-theme',S.theme==='light');
  if(S.map&&S.vecL&&S.mapStyle==='vector'){
    S.vecL.setUrl(S.theme==='light'
      ?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');
  }
}

/* ── CHART ── */
function initChart(){
  const ctx=$('speedChart').getContext('2d');
  S.chart=new Chart(ctx,{
    type:'line',
    data:{labels:[],datasets:[{label:'Speed',data:[],borderColor:'#00d4ff',backgroundColor:'rgba(0,212,255,0.1)',tension:0.4,borderWidth:2,pointRadius:0,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},scales:{x:{display:false},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#5a7a9a',font:{size:10}}}}}
  });
}
function addSample(spd){
  const lbl=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  S.speedLbl.push(lbl); S.speedD.push(+spd.toFixed(1));
  if(S.speedLbl.length>60){ S.speedLbl.shift(); S.speedD.shift(); }
  S.chart.data.labels=[...S.speedLbl]; S.chart.data.datasets[0].data=[...S.speedD];
  S.chart.update('none');
}

/* ── GPS ── */
function setGpsBadge(txt,cls='warn'){
  $('gpsBadge').innerHTML=`<div class="dot"></div>${txt}`;
  $('gpsBadge').className='badge '+cls;
}

function showDebug(msg){
  const d=$('gpsDebug');
  d.textContent=msg; d.classList.add('show');
  clearTimeout(window._dbg);
  window._dbg=setTimeout(()=>d.classList.remove('show'),5000);
}

function getSpeed(pos){
  if(pos.coords.speed!=null&&!isNaN(pos.coords.speed)&&pos.coords.speed>=0)
    return pos.coords.speed*3.6;
  if(S.lastPos&&S.lastAt){
    const dt=(Date.now()-S.lastAt)/1000;
    if(dt>0.2){
      const d=haversine([S.lastPos.coords.latitude,S.lastPos.coords.longitude],[pos.coords.latitude,pos.coords.longitude]);
      return Math.min(d/(dt/3600),300);
    }
  }
  return 0;
}

function updateCals(spd,dtH){
  const w=Math.max(20,S.weightKg||65);
  let met=2.3;
  if(spd>=10) met=9.8; else if(spd>=8) met=8.3; else if(spd>=6) met=6.0; else if(spd>=3) met=3.8;
  S.cals+=met*w*dtH;
}

function checkLimit(spd){
  const lim=Number(S.speedLimit)||0; if(!lim) return;
  const over=spd>lim;
  $('spdAlert').classList.toggle('show',over);
  if(over&&!S.overFired){ S.overFired=true; speak('Over speeding. Slow down.'); vib([200,80,200]); }
  if(!over) S.overFired=false;
}

function updateUI(pos,spd){
  $('hudSpd').textContent=spd.toFixed(1);
  const mode=spd>=18?'🚗 Vehicle':spd>=6?'🏃 Running':spd>0.8?'🚶 Walking':'⚫ Idle';
  $('hudMode').textContent=S.tracking?mode:'⚫ Idle';
  $('distVal').textContent=S.dist.toFixed(2);
  $('altVal').textContent=pos.coords.altitude!=null?Math.round(pos.coords.altitude):'--';
  $('stepsVal').textContent=Math.round(S.steps).toLocaleString();
  $('calVal').textContent=Math.round(S.cals);
  const elapsed=S.startTime?Date.now()-S.startTime:0;
  const avg=elapsed>0?S.dist/(elapsed/3600000):0;
  $('durVal').textContent=fmtDur(elapsed);
  $('avgVal').textContent=avg.toFixed(1);
  const pct=clamp((S.dist/Math.max(0.1,S.goalKm))*100,0,100);
  $('barFill').style.width=pct+'%'; $('goalPct').textContent=Math.round(pct)+'%';
  if(pct>=100&&S.dist>0) confetti({particleCount:50,origin:{y:0.55}});
}

function onGeo(pos){
  const now=Date.now();
  if(S.batSave&&S.battLevel<=0.2&&(now-S.lastAt)<5000) return;

  const lat=pos.coords.latitude, lng=pos.coords.longitude, cur=[lat,lng];
  const spd=getSpeed(pos);
  const dtH=S.lastAt?(now-S.lastAt)/3600000:0;

  // Heading
  if(pos.coords.heading!=null&&!isNaN(pos.coords.heading)&&spd>1){
    S.heading=pos.coords.heading;
    $('needle').style.transform=`rotate(${S.heading}deg)`;
    $('cDeg').textContent=Math.round(S.heading)+'°';
  }

  // Distance
  if(S.lastPos){
    const prev=[S.lastPos.coords.latitude,S.lastPos.coords.longitude];
    const moved=haversine(prev,cur);
    if(moved*1000>=1.5){ S.dist+=moved; S.steps+=(moved*1000)/0.78; if(dtH>0) updateCals(spd,dtH); }
  }
  if(spd>S.maxSpd) S.maxSpd=spd;
  S.tripPts.push({lat,lng,speed:spd,time:now,alt:pos.coords.altitude||0});
  addSample(spd);
  S.pathLine.addLatLng(cur);

  // Map
  S.loc=cur;
  S.marker.setLatLng(cur);
  if(!S.firstFix){
    S.map.setView(cur,16,{animate:true});
    S.firstFix=true;
  } else {
    S.map.panTo(cur,{animate:true,duration:0.5});
  }

  // Accuracy circle
  const acc=pos.coords.accuracy||0;
  if(acc>0){
    if(!S.accCircle){
      S.accCircle=L.circle(cur,{radius:acc,color:'#00d4ff',weight:1,fillColor:'#00d4ff',fillOpacity:0.05}).addTo(S.map);
    } else { S.accCircle.setLatLng(cur).setRadius(acc); }
  }

  checkLimit(spd);
  updateUI(pos,spd);
  S.lastPos=pos; S.lastAt=now;

  const accTxt=acc?` ±${Math.round(acc)}m`:'';
  setGpsBadge(`GPS${accTxt}`,'live');
  $('statusText').textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

function onGeoErr(err){
  console.error('GPS ERR',err.code, err.message);
  const msgs={1:'Location permission denied — check browser settings',2:'GPS signal unavailable — try outdoors',3:'GPS timeout — retrying…'};
  const cls={1:'bad',2:'warn',3:'warn'};
  const msg=msgs[err.code]||('GPS error: '+err.message);
  setGpsBadge(['','No Permission','No Signal','Timeout'][err.code]||'Error', cls[err.code]||'bad');
  $('statusText').textContent=msg;
  showDebug('GPS Error '+err.code+': '+msg);
  toast('⚠️ '+msg, 4000);
  if(err.code===3) setTimeout(startGPS, 3000); // retry on timeout
}

function startGPS(){
  if(!navigator.geolocation){ setGpsBadge('Not Supported','bad'); toast('Geolocation not supported'); return; }
  if(!window.isSecureContext&&location.hostname!=='localhost'){
    setGpsBadge('Needs HTTPS','bad');
    $('statusText').textContent='Open via HTTPS or localhost';
    toast('⚠️ Needs HTTPS for GPS'); return;
  }

  if(S.watchId!=null){ navigator.geolocation.clearWatch(S.watchId); S.watchId=null; }

  setGpsBadge('Locating…','warn');
  $('statusText').textContent='Requesting GPS permission…';

  const hiOpts={enableHighAccuracy:true, maximumAge:0, timeout:15000};
  const loOpts={enableHighAccuracy:false, maximumAge:10000, timeout:20000};

  // Try high accuracy first, fallback to low accuracy
  navigator.geolocation.getCurrentPosition(
    pos=>{ onGeo(pos); showDebug(`Fix: ±${Math.round(pos.coords.accuracy||0)}m acc`); },
    err=>{
      console.warn('Hi-acc failed, trying low-acc', err.code);
      if(err.code===1){ onGeoErr(err); return; } // permission denied — no retry
      navigator.geolocation.getCurrentPosition(onGeo, onGeoErr, loOpts);
    },
    hiOpts
  );

  // Continuous watch with high accuracy
  S.watchId=navigator.geolocation.watchPosition(onGeo, onGeoErr, hiOpts);
}

/* ── ORIENTATION ── */
async function reqOrient(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p==='granted') window.addEventListener('deviceorientation',handleOrient,true);
    } else {
      window.addEventListener('deviceorientationabsolute',handleOrient,true);
      window.addEventListener('deviceorientation',handleOrient,true);
    }
  }catch(e){}
}
function handleOrient(e){
  const h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(typeof e.alpha==='number'?(360-e.alpha):null);
  if(h===null||isNaN(h)) return;
  S.heading=(h+360)%360;
  $('needle').style.transform=`rotate(${S.heading}deg)`;
  $('cDeg').textContent=Math.round(S.heading)+'°';
}

/* ── BATTERY ── */
async function initBatt(){
  try{
    if(!navigator.getBattery) return;
    const b=await navigator.getBattery();
    const upd=()=>{ S.battLevel=b.level; $('battBadge').textContent=`🔋 ${Math.round(b.level*100)}%`; };
    b.addEventListener('levelchange',upd); upd();
  }catch(e){}
}

/* ── SEARCH ── */
async function doSearch(){
  const q=$('searchIn').value.trim(); if(!q){ toast('Type a place name'); return; }
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q)}&accept-language=si,en`);
    const d=await r.json();
    if(!d||!d.length){ toast('Not found'); return; }
    const lat=parseFloat(d[0].lat), lng=parseFloat(d[0].lon);
    S.map.setView([lat,lng],15,{animate:true});
    L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div style="font-size:28px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5))">🎯</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(S.map).bindPopup(d[0].display_name).openPopup();
    speak('Showing '+q);
  }catch(e){ toast('Search failed'); }
}

/* ── SOS ── */
function triggerSOS(){
  vib([300,100,300,100,300]); speak('Emergency SOS');
  const loc=S.loc?`https://maps.google.com/maps?q=${S.loc[0]},${S.loc[1]}`:'Unknown';
  const msg=encodeURIComponent(`EMERGENCY!\nLocation: ${loc}\nTime: ${new Date().toLocaleString()}`);
  if(!confirm('Send emergency SOS?')) return;
  const c=S.sos||'119';
  if(c.includes('@')) window.location.href=`mailto:${c}?subject=EMERGENCY&body=${msg}`;
  else window.location.href=`sms:${c}?body=${msg}`;
}

/* ── EXPORT GPX ── */
function exportGPX(trip){
  if(!trip||!trip.points.length){ toast('No data'); return; }
  const safe=(trip.name||'Trip').replace(/[^\w\- ]+/g,'_').replace(/\s+/g,'_');
  let x=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="SRLocation">\n<trk>\n<name>${trip.name}</name>\n<trkseg>\n`;
  trip.points.forEach(p=>{ x+=`<trkpt lat="${p.lat}" lon="${p.lng}"><ele>${p.alt||0}</ele></trkpt>\n`; });
  x+=`</trkseg>\n</trk>\n</gpx>`;
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'})),download:safe+'.gpx'});
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ── HISTORY ── */
function renderHist(){
  const list=$('histList'), q=($('filterIn').value||'').toLowerCase();
  const fl=S.trips.filter(t=>!q||(t.name||'').toLowerCase().includes(q));
  list.innerHTML='';
  if(!fl.length){ list.innerHTML='<div class="trip-card" style="color:var(--muted);text-align:center;padding:20px;">No saved trips yet</div>'; return; }
  fl.forEach(t=>{
    const d=document.createElement('div'); d.className='trip-card';
    d.innerHTML=`<div class="trip-head"><div><div class="trip-name"></div><div class="trip-date">${fmtDT(t.startTime)}</div></div><div class="trip-dist">${t.distanceKm.toFixed(2)} km</div></div><div class="trip-stats"><div>Duration: <strong>${fmtDur(t.durationMs)}</strong></div><div>Avg: <strong>${t.avgSpeed.toFixed(1)} km/h</strong></div><div>Max: <strong>${t.maxSpeed.toFixed(1)} km/h</strong></div><div>Cals: <strong>${t.calories} kcal</strong></div></div><div class="trip-acts"><button class="btn soft vb" style="flex:1;padding:8px;font-size:0.78rem;">View</button><button class="btn soft xb" style="flex:1;padding:8px;font-size:0.78rem;">GPX</button><button class="btn ghost db" style="flex:1;padding:8px;font-size:0.78rem;">Del</button></div>`;
    d.querySelector('.trip-name').textContent=t.name;
    d.querySelector('.vb').onclick=()=>viewTrip(t.id);
    d.querySelector('.xb').onclick=()=>exportGPX(t);
    d.querySelector('.db').onclick=()=>delTrip(t.id);
    list.appendChild(d);
  });
}

function viewTrip(id){
  const t=S.trips.find(x=>x.id===id); if(!t||!t.points.length) return;
  const ll=t.points.map(p=>[p.lat,p.lng]);
  S.pathLine.setLatLngs(ll); S.marker.setLatLng(ll[ll.length-1]);
  S.map.fitBounds(L.latLngBounds(ll),{padding:[30,30]});
  setTab('driveTab'); toast('Viewing: '+t.name);
}

function delTrip(id){
  if(!confirm('Delete this trip?')) return;
  S.trips=S.trips.filter(t=>t.id!==id); saveTrips(); renderHist();
}

/* ── UI ── */
function setTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));
  setTimeout(()=>S.map&&S.map.invalidateSize(),100);
}

function openDrawer(v){ $('drawerEl').classList.toggle('open',v); $('overlay').classList.toggle('show',v); }

function syncTogsUI(){
  const t=(id,on,lbl)=>{ const b=$(id); b.textContent=lbl+(on?' ON':' OFF'); b.classList.toggle('on',on); };
  t('togVoice',S.voiceOn,'Voice'); t('togVib',S.vibOn,'Vibrate'); t('togBat',S.batSave,'BatSave');
  $('cLimit').textContent=`Limit ${S.speedLimit||'--'} km/h`;
}

function syncInputs(){
  $('wIn').value=S.weightKg; $('limIn').value=S.speedLimit; $('goalIn').value=S.goalKm;
  $('avStyle').value=S.avStyle; $('avUrl').value=S.avUrl||''; $('sosIn').value=S.sos||'';
  syncTogsUI();
}

/* ── EVENTS ── */
function bindEvents(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('themeBtn').onclick=()=>{ S.theme=S.theme==='dark'?'light':'dark'; saveCfg(); applyTheme(); toast('Theme: '+S.theme); };
  $('drawerBtn').onclick=()=>openDrawer(true);
  $('closeDrawer').onclick=()=>openDrawer(false);
  $('overlay').onclick=()=>openDrawer(false);

  $('trackBtn').onclick=()=>{
    if(S.tracking){
      S.tracking=false; $('trackBtn').textContent='▶ Start'; $('trackBtn').className='btn primary';
      $('spdAlert').classList.remove('show'); toast('Tracking stopped'); speak('Tracking stopped');
    } else {
      S.tracking=true; S.startTime=Date.now();
      S.dist=0; S.cals=0; S.steps=0; S.maxSpd=0;
      S.tripPts=[]; S.speedD=[]; S.speedLbl=[];
      S.pathLine.setLatLngs([]); S.overFired=false;
      $('trackBtn').textContent='⏹ Stop'; $('trackBtn').className='btn stop';
      toast('Tracking started'); speak('Tracking started');
    }
  };

  $('sosBtn').onclick=triggerSOS;

  $('recentBtn').onclick=()=>{ if(S.loc) S.map.setView(S.loc,17,{animate:true}); else toast('No GPS fix yet'); };
  $('fullBtn').onclick=()=>{ $('mapWrap').classList.toggle('fullscreen'); setTimeout(()=>S.map.invalidateSize(),200); };
  $('headBtn').onclick=async()=>{ S.headingUp=!S.headingUp; $('headBtn').classList.toggle('on',S.headingUp); if(S.headingUp) await reqOrient(); toast('Heading Up: '+(S.headingUp?'ON':'OFF')); };

  $('searchBtn').onclick=doSearch;
  $('searchIn').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

  $('wIn').onchange=e=>{ S.weightKg=parseFloat(e.target.value)||65; saveCfg(); };
  $('limIn').onchange=e=>{ S.speedLimit=parseFloat(e.target.value)||0; saveCfg(); syncTogsUI(); };
  $('goalIn').onchange=e=>{ S.goalKm=Math.max(0.1,parseFloat(e.target.value)||5); saveCfg(); };
  $('avStyle').onchange=e=>{ S.avStyle=e.target.value; saveCfg(); if(S.marker) S.marker.setIcon(mkIcon()); };
  $('avUrl').onchange=e=>{ S.avUrl=e.target.value.trim(); saveCfg(); if(S.marker) S.marker.setIcon(mkIcon()); };
  $('sosIn').onchange=e=>{ S.sos=e.target.value.trim(); saveCfg(); };

  $('avFile').onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ S.avUrl=r.result; $('avUrl').value=''; saveCfg(); if(S.marker) S.marker.setIcon(mkIcon()); toast('Avatar updated'); };
    r.readAsDataURL(f);
  };

  const tog=(id,key)=>{ $(id).onclick=()=>{ S[key]=!S[key]; saveCfg(); syncTogsUI(); toast(key+': '+(S[key]?'ON':'OFF')); }; };
  tog('togVoice','voiceOn'); tog('togVib','vibOn'); tog('togBat','batSave');

  $('vecBtn').onclick=()=>{ S.mapStyle='vector'; saveCfg(); applyStyle(); toast('Vector map'); };
  $('satBtn').onclick=()=>{ S.mapStyle='satellite'; saveCfg(); applyStyle(); toast('Satellite map'); };

  $('saveNowBtn').onclick=()=>{ finalizeTrip(true); $('tripNameIn').value=''; };
  $('saveTripBtn').onclick=()=>{ finalizeTrip(true); };
  $('exportBtn').onclick=()=>{ if(!S.tripPts.length){ toast('No data'); return; } exportGPX({name:$('tripNameIn').value.trim()||'Trip',points:S.tripPts}); };
  $('refreshBtn').onclick=renderHist;
  $('filterIn').oninput=renderHist;
  $('clearBtn').onclick=()=>{ if(!confirm('Erase ALL data?')) return; localStorage.clear(); location.reload(); };

  // Test GPS button
  $('testGpsBtn').onclick=()=>{
    openDrawer(false);
    toast('Testing GPS…');
    showDebug('Testing GPS…');
    if(!navigator.geolocation){ showDebug('❌ navigator.geolocation not available!'); return; }
    if(!window.isSecureContext){ showDebug('❌ Not secure context (needs HTTPS)!'); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ showDebug(`✅ GPS OK! Lat:${p.coords.latitude.toFixed(5)} Lng:${p.coords.longitude.toFixed(5)} Acc:±${Math.round(p.coords.accuracy||0)}m`); toast('✅ GPS working!'); },
      e=>{ showDebug(`❌ GPS failed: code=${e.code} msg=${e.message}`); toast('❌ GPS failed: code '+e.code); },
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  };
}

/* ── TIMER ── */
function startTimer(){
  setInterval(()=>{
    if(!S.tracking||!S.startTime) return;
    const e=Date.now()-S.startTime;
    $('durVal').textContent=fmtDur(e);
    if(e>0) $('avgVal').textContent=(S.dist/(e/3600000)).toFixed(1);
  },1000);
}

/* ── INIT ── */
function init(){
  loadTrips(); initMap(); bindEvents();
  applyTheme(); applyStyle(); syncInputs(); renderHist(); setTab('driveTab');
  initBatt(); startTimer();
  startGPS();
}
window.addEventListener('load',init);
</script>
</body>
</html>
